[workspace]
members = [
    "ks-core",
    "ks-driver",
    "ks-link",
    "ks-sdk",
    "ks-ui-common",
    "ks-gui",
    "ks-inspector",
    "ks-test",
    "ks-hook-test",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
ks-core = { path = "ks-core", default-features = false }
ks-link = { path = "ks-link" }
ks-sdk = { path = "ks-sdk" }
ks-ui-common = { path = "ks-ui-common" }
dt-loader = { path = "../driver-toolkit/dt-loader" }

egui_overlay = { path = "vendor/egui_overlay", default-features = false, features = ["egui_default", "glfw_default"] }
egui_render_d3d11 = { path = "vendor/egui_render_d3d11" }
# Plain GLFW window/input layer for `ks-inspector` (an ordinary opaque
# window, no overlay passthrough). Same fork the vendored egui stack uses, so
# the workspace still builds a single GLFW.
glfw = { package = "glfw-passthrough", version = "0.55" }
egui = { version = "0.36.2", default-features = false }
windows-sys = "0.61.2"
mlua = { version = "0.12.0", features = ["luau-jit", "vendored", "send"] }
encoding_rs = "0.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

notify = "6.1.1"
rfd = "0.14.1"

# The two egui stack crates are vendored so both desktop apps share the same
# egui 0.36-compatible window backend and the overlay height cap. The patch
# section keeps transitive `egui_overlay`/window-backend requirements on the
# local copies instead of crates.io 0.9.0 (egui 0.29), which would produce
# duplicate, type-incompatible egui versions.
[patch.crates-io]
egui_overlay = { path = "vendor/egui_overlay" }
egui_window_glfw_passthrough = { path = "vendor/egui_window_glfw_passthrough" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

# GUI frame and Lua callback boundaries recover runtime panics.
[profile.gui-release]
inherits = "release"
panic = "unwind"
